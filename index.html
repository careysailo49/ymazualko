<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zualko Notice Builder App</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --yma-red: #c90000;
            --dark-bg: #000000;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: #f3f4f6;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 24px;
            margin: 15px 0 5px 0;
            color: #111;
            text-align: center;
        }

        /* Responsive Layout Grid */
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 1300px;
            margin-top: 10px;
        }

        @media (min-width: 1024px) {
            .container {
                flex-direction: row;
                align-items: flex-start;
                padding: 10px;
            }

            body {
                padding: 20px;
            }

            h1 {
                font-size: 32px;
                margin-bottom: 15px;
            }
        }

        /* Form Configuration Control Board */
        .form-panel {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 550px;
        }

        .form-panel h2 {
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid var(--yma-red);
            padding-bottom: 8px;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #555;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            background-color: #fff;
            width: 100%;
        }

        .row-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .counter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        /* Download Action Button Styling */
        .btn-download {
            background-color: #1b3d2f;
            color: white;
            font-size: 16px;
            font-weight: 700;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-download:hover {
            background-color: #132b21;
        }

        .btn-download:active {
            transform: scale(0.99);
        }

        /* Responsive Poster View Scale Frame Box Wrapper */
        .poster-scale-box {
            width: 100%;
            max-width: 700px;
            aspect-ratio: 1 / 1;
            position: relative;
        }

        /* 1:1 Clean Rendered Poster Layout to match image layout specs */
        .poster-preview {
            width: 700px;
            height: 700px;
            background: #fdfdfd;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: top left;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* Top Header Image Strip Area */
        .poster-header-banner {
            width: 100%;
            height: 100px;
            position: relative;
            background: var(--yma-red);
        }

        .poster-header-banner img {
            width: 100%;
            height: 100%;
            object-fit: fill;
        }

        /* Floating Header Subtitle Text directly aligned beneath ZUALKO header area */
        .header-dynamic-subtitle {
            position: absolute;
            right: 45px;
            bottom: 12px;
            color: #ffffff;
            font-size: 19px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-align: right;
            text-shadow: 0px 1px 3px rgba(0, 0, 0, 0.5);
        }

        /* Triple Column Structural Main Body Space */
        .poster-body {
            display: grid;
            grid-template-columns: 50% 30% 20%;
            padding: 15px 10px 5px 20px;
            height: 245px;
            align-items: center;
        }

        /* Left Info Side text styling blocks */
        .details-side {
            font-size: 15px;
            line-height: 1.4;
            color: black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2px;
        }

        /* Aligns label, colon, and value perfectly into columns */
        .details-side p {
            display: grid;
            grid-template-columns: 78px 12px 1fr;
            font-weight: 700;
            white-space: nowrap;
        }

        .details-side span.label {
            font-weight: 800;
            text-transform: uppercase;
        }

        .details-side span.colon {
            font-weight: 800;
            text-align: center;
        }

        .details-side span.val {
            font-weight: 800;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Middle Centered Frame Avatar Container */
        .avatar-center-zone {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avatar-container {
            width: 175px;
            height: 175px;
            border-radius: 50%;
            border: 5px solid #111;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.45);
            overflow: hidden;
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Right Side Column QR Target Layout Space block positioning */
        .qr-right-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding-right: 5px;
        }

        .qr-right-zone h4 {
            font-size: 16px;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 8px;
            color: #000;
        }

        .qr-box {
            width: 85px;
            height: 85px;
            border: 1px dashed #666;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
        }

        .qr-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Middle Condolence Horizontal Ribbon Banner Strip Separator Component */
        .condolence-bar {
            text-align: center;
            font-size: 17px;
            font-weight: 700;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 2px;
            color: #000;
        }

        .condolence-flag {
            height: 14px;
            width: auto;
            object-fit: contain;
        }

        /* User-controlled Satellite Maps Canvas Area layout container block specifications */
        .map-wrapper {
            padding: 0 15px;
            height: 195px;
            margin-top: 4px;
            display: flex;
            justify-content: center;
        }

        .map-area {
            width: 66%;
            height: 100%;
            background: #1b3d2f;
            border: 1px solid #bbb;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .map-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Numeric Statistics Display Layout Row Matrix items metrics blocks space tracking elements */
        .counters-section {
            padding: 6px 60px 2px 60px;
            font-weight: 800;
            font-size: 15.5px;
        }

        .counter-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2px;
            color: #c90000;
            text-transform: uppercase;
        }

        .total-row {
            text-align: center;
            font-size: 15.5px;
            color: #c90000;
            margin-top: 1px;
            letter-spacing: 0.2px;
            text-transform: uppercase;
        }

        /* Bottom Dynamic Manual Content Footer Space Box Notice strip panel container */
        .poster-footer {
            background: var(--dark-bg);
            color: white;
            text-align: center;
            padding: 8px 20px;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.4;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>

    <h1>Zualko Information System</h1>

    <div class="container">
        <div class="form-panel">
            <h2>Enter Details</h2>

            <div class="form-group">
                <label>Zualko Subtitle Banner Text (e.g., Kum 2026-a 7-na)</label>
                <input type="text" id="inHeaderText" value="Kum 2026-a 7-na">
            </div>

            <div class="row-group">
                <div class="form-group">
                    <label>Hming (Name)</label>
                    <input type="text" id="inHming" value="">
                </div>
                <div class="form-group">
                    <label>Kum (Age)</label>
                    <input type="number" id="inKum" value="">
                </div>
            </div>

            <div class="row-group">
                <div class="form-group">
                    <label>Chhungte Chanchin (Relation & Name)</label>
                    <div style="display: grid; grid-template-columns: 80px 1fr; gap: 8px;">
                        <select id="inRelationType">
                            <option value="W/o">W/o</option>
                            <option value="H/o">H/o</option>
                            <option value="S/o" selected>S/o</option>
                            <option value="D/o">D/o</option>
                        </select>
                        <input type="text" id="inSo" value="">
                    </div>
                </div>
                <div class="form-group">
                    <label>Section</label>
                    <select id="inSection">
                        <option value="Chawngbawla Section"selected>Chawngbawla Section</option>
                        <option value="Vanapa Section" >Vanapa Section</option>
                        <option value="Taitesena Section">Taitesena Section</option>
                        <option value="Khuangchera Section">Khuangchera Section</option>
                    </select>
                </div>
            </div>

            <div class="row-group">
                <div class="form-group">
                    <label>Thih Ni (Date of Death)</label>
                    <input type="date" id="inThihNi">
                </div>
                <div class="form-group">
                    <label>Thih Hun (Time of Death)</label>
                    <input type="time" id="inThihHun">
                </div>
            </div>

            <div class="row-group">
                <div class="form-group">
                    <label>Vui Ni (Funeral Date)</label>
                    <input type="date" id="inVuiNi">
                </div>
                <div class="form-group">
                    <label>Vui Hun (Funeral Time)</label>
                    <input type="time" id="inVuiHun">
                </div>
            </div>

            <div class="row-group">
                <div class="form-group">
                    <label>Vuitu (Officiator)</label>
                    <input type="text" id="inVuitu" value="">
                </div>
                <div class="form-group">
                    <label>Kohhran (Church)</label>
                    <input type="text" id="inKohhran" value="">
                </div>
            </div>

            <div class="row-group">
                <div class="form-group">
                    <label>Upload Passport Photo</label>
                    <input type="file" id="inPassport" accept="image/*">
                </div>
                <div class="form-group">
                    <label>Upload QR Code</label>
                    <input type="file" id="inQr" accept="image/*">
                </div>
            </div>

            <div class="form-group">
                <label>Upload Google Map Location</label>
                <input type="file" id="inMapImage" accept="image/*">
            </div>

            <div class="counter-grid">
                <div class="form-group">
                    <label>Mipa</label>
                    <input type="number" id="inMipa" value="" min="0">
                </div>
                <div class="form-group">
                    <label>Hmeichhia</label>
                    <input type="number" id="inHmeichhia" value="" min="0">
                </div>
                <div class="form-group">
                    <label>Ruang Chhuak</label>
                    <input type="number" id="inRuang" value="0" min="0">
                </div>
            </div>

            <div class="form-group">
                <label>Footer Notice Message (Manual text)</label>
                <input type="text" id="inFooter"
                    value="Vawiinah vui nghal tur a ni a, khawntesep pawh khawn nghal tur a ni a. Tlangval tlawmngai ten thlan laih nghal tur a ni.">
            </div>

            <button class="btn-download" id="btnDownload">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                Download Poster Image
            </button>
        </div>

        <div class="poster-scale-box">
            <div class="poster-preview" id="posterArea">

                <div class="poster-header-banner">
                    <img src="header.jpg" alt="Young Mizo Association Zualko Header Banner">
                    <div class="header-dynamic-subtitle" id="lblHeaderText"></div>
                </div>

                <div class="poster-body">
                    <div class="details-side">
                        <p><span class="label">HMING</span><span class="colon">:</span><span class="val" id="lblHming"></span></p>
                        <p><span class="label">KUM</span><span class="colon">:</span><span class="val" id="lblKum"></span></p>
                        <p><span class="label" id="lblRelationLabel">S/o</span><span class="colon">:</span><span class="val" id="lblSo"></span></p>
                        <p><span class="label">SECTION</span><span class="colon">:</span><span class="val" id="lblSection"></span></p>
                        <p><span class="label">THIH NI</span><span class="colon">:</span><span class="val" id="lblThihNi"></span></p>
                        <p><span class="label">THIH HUN</span><span class="colon">:</span><span class="val" id="lblThihHun"></span></p>
                        <p><span class="label">VUI NI</span><span class="colon">:</span><span class="val" id="lblVuiNi"></span></p>
                        <p><span class="label">VUI HUN</span><span class="colon">:</span><span class="val" id="lblVuiHun"></span></p>
                        <p><span class="label">VUITU</span><span class="colon">:</span><span class="val" id="lblVuitu"></span></p>
                        <p><span class="label">KOHHRAN</span><span class="colon">:</span><span class="val" id="lblKohhran"></span></p>
                    </div>

                    <div class="avatar-center-zone">
                        <div class="avatar-container">
                            <img id="viewPassport"
                                src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23ccc'/><text x='50' y='55' font-size='10' text-anchor='middle' fill='%23666'>No Photo</text></svg>">
                        </div>
                    </div>

                    <div class="qr-right-zone">
                        <h4>Mitthi<br>Chanchin<br>Tawi</h4>
                        <div class="qr-box">
                            <img id="viewQr"
                                src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23eee'/><text x='50' y='55' font-size='12' text-anchor='middle' fill='%23aaa'>QR</text></svg>">
                        </div>
                    </div>
                </div>

                <div class="condolence-bar">
                    Lusun chhungte kan tawrhpui hle..
                    <img src="yma.jpg" class="condolence-flag" alt="YMA Flag">
                </div>

                <div class="map-wrapper">
                    <div class="map-area">
                        <img id="mapImage"
                            src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='160' viewBox='0 0 600 160'><rect width='600' height='160' fill='%231b3d2f'/><text x='50% ' y='50%' fill='white' font-weight='bold' font-size='15' text-anchor='middle'>Upload Google Map Location</text></svg>">
                    </div>
                </div>

                <div class="counters-section">
                    <div class="counter-row">
                        <div>MIPA : <span id="lblMipa">0</span></div>
                        <div>HMEICHHIA : <span id="lblHmeichhia">0</span></div>
                    </div>
                    <div class="counter-row">
                        <div>RUANG CHHUAK : <span id="lblRuang">0</span></div>
                        <div>TOTAL : <span id="lblTotal">0</span></div>
                    </div>
                    <div class="total-row">
                        THLANMUALA PHUM TAWH ZAWNG ZAWNG: <span id="lblThlanmual">0</span>
                    </div>
                </div>

                <div class="poster-footer" id="lblFooter"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const now = new Date();

            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const currentDate = `${year}-${month}-${day}`;

            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const currentTime = `${hours}:${minutes}`;

            document.getElementById('inThihNi').value = currentDate;
            document.getElementById('inVuiNi').value = currentDate;
            
            document.getElementById('inThihHun').value = currentTime;
            document.getElementById('inVuiHun').value = currentTime;

            updatePoster();
        });        

        // Added 'inRelationType' here to track it for realtime updates
        const inputs = ['inHming', 'inKum', 'inSo', 'inRelationType', 'inSection', 'inVuitu', 'inKohhran', 'inMipa', 'inHmeichhia', 'inRuang', 'inFooter', 'inHeaderText'];
        const dateFields = ['inThihNi', 'inVuiNi'];
        const timeFields = ['inThihHun', 'inVuiHun'];

        function formatCustomDate(strVal) {
            if (!strVal) return "";
            const d = new Date(strVal);
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const day = d.getDate();
            let suffix = "th";
            if (day === 1 || day === 21 || day === 31) suffix = "st";
            else if (day === 2 || day === 22) suffix = "nd";
            else if (day === 3 || day === 23) suffix = "rd";
            return `Dt. ${day}${suffix} ${months[d.getMonth()]} ${d.getFullYear()}`;
        }

        function formatCustomTime(strVal) {
            if (!strVal) return "";
            const parts = strVal.split(':');
            let hours = parseInt(parts[0]);
            const minutes = parts[1];
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            return `${hours}:${minutes} ${ampm}`;
        }

        function updatePoster() {
            inputs.forEach(id => {
                if (id === 'inRelationType') {
                    // Update the prefix text specifically (e.g. "S/o" or "W/o")
                    document.getElementById('lblRelationLabel').innerText = document.getElementById(id).value;
                } else {
                    const targetId = id.replace('in', 'lbl');
                    const targetElem = document.getElementById(targetId);
                    if (targetElem) targetElem.innerText = document.getElementById(id).value;
                }
            });

            dateFields.forEach(id => {
                const targetId = id.replace('in', 'lbl');
                document.getElementById(targetId).innerText = formatCustomDate(document.getElementById(id).value);
            });

            timeFields.forEach(id => {
                const targetId = id.replace('in', 'lbl');
                document.getElementById(targetId).innerText = formatCustomTime(document.getElementById(id).value);
            });

            const mipa = parseInt(document.getElementById('inMipa').value) || 0;
            const hmeichhia = parseInt(document.getElementById('inHmeichhia').value) || 0;
            const ruang = parseInt(document.getElementById('inRuang').value) || 0;
            document.getElementById('lblTotal').innerText = mipa + hmeichhia + ruang;
            document.getElementById('lblThlanmual').innerText = 141 + mipa + hmeichhia; 
        }

        function structuralResponsiveResizeHandler() {
            const containerBox = document.querySelector('.poster-scale-box');
            const posterItem = document.getElementById('posterArea');
            if(containerBox && posterItem) {
                const currentWidth = containerBox.offsetWidth;
                const targetedScaleFactor = currentWidth / 700;
                posterItem.style.transform = `scale(${targetedScaleFactor})`;
            }
        }

        function setupImageUpload(inputId, viewId) {
            document.getElementById(inputId).addEventListener('change', function (e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (event) {
                        document.getElementById(viewId).src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });
        }

        inputs.concat(dateFields).concat(timeFields).forEach(id => {
            const elem = document.getElementById(id);
            if(elem) elem.addEventListener('input', updatePoster);
            if(elem && elem.tagName === 'SELECT') elem.addEventListener('change', updatePoster);
        });

        setupImageUpload('inPassport', 'viewPassport');
        setupImageUpload('inQr', 'viewQr');
        setupImageUpload('inMapImage', 'mapImage');

        window.addEventListener('resize', structuralResponsiveResizeHandler);
        structuralResponsiveResizeHandler();

        // Image capture export sequence
        document.getElementById('btnDownload').addEventListener('click', function () {
            const posterArea = document.getElementById('posterArea');
            const originalTransformStyle = posterArea.style.transform;
            
            posterArea.style.transform = "none";

            html2canvas(posterArea, {
                useCORS: true,
                scale: 2, 
                width: 700,
                height: 700
            }).then(canvas => {
                posterArea.style.transform = originalTransformStyle;

                const downloadLink = document.createElement('a');
                downloadLink.download = 'zualko-notice.png';
                downloadLink.href = canvas.toDataURL('image/png');
                downloadLink.click();
            }).catch(err => {
                console.error("Export failure: ", err);
                posterArea.style.transform = originalTransformStyle;
            });
        });
    </script>
</body>

</html>
